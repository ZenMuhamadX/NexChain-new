[package]
name = "nex-miner"
version = "0.1.0"
edition = "2021"
description = "NexChain external PoW miner — keyless, stateless, RPC-only"

# Miner ini SENGAJA kecil dan mandiri: tidak ada tokio, clap, atau DB.
# `sha2` fitur `compress` memberi akses ke compression function (midstate);
# `ureq` sudah membawa rustls sehingga https:// berfungsi tanpa OpenSSL.
[dependencies]
sha2 = { version = "0.10", features = ["compress"] }
serde_json = "1"
rpassword = "7"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
