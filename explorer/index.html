<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>NexChain Explorer</title>
		<meta
			name="description"
			content="Read-only block explorer for the NexChain blockchain — browse blocks, transactions, addresses and the live mempool."
		/>
		<meta name="theme-color" content="#008ff6" />

		<!-- Share preview (Discord/Telegram/Slack) — dulu tampil kosong -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="NexChain Explorer" />
		<meta property="og:title" content="NexChain Explorer" />
		<meta
			property="og:description"
			content="Browse blocks, transactions, addresses and the live mempool on NexChain."
		/>
		<meta property="og:image" content="../brand/png/logo-1200.png" />
		<meta property="og:image:alt" content="NexChain" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="../brand/png/logo-1200.png" />

		<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml" />
		<link
			rel="alternate icon"
			href="../brand/png/favicon-32.png"
			sizes="32x32"
			type="image/png"
		/>
		<link rel="icon" href="../brand/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="apple-touch-icon" href="../brand/png/apple-touch-icon-180.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<script>
			/* Terapkan tema SEBELUM paint supaya tidak ada kilatan terang saat
			   pengguna memilih tema gelap (dan sebaliknya). Sumbernya
			   localStorage; default produk = gelap. `ThemeToggle` membaca
			   `data-theme` ini saat mount, jadi tidak ada dua sumber kebenaran. */
			;(() => {
				let theme = 'dark'
				try {
					const saved = localStorage.getItem('nex:theme')
					if (saved === 'light' || saved === 'dark') theme = saved
				} catch {
					/* localStorage diblokir — pakai default produk */
				}
				document.documentElement.dataset.theme = theme
			})()
		</script>
		<style>
			/* Cadangan sebelum CSS bundle termuat (dan bila JS mati): warnai
			   latar sesuai `data-theme` agar tidak ada kilatan warna. */
			html {
				background: #0f1317;
				color-scheme: dark;
			}

			html[data-theme='light'] {
				background: #f6f8fa;
				color-scheme: light;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
