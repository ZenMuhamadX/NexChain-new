<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NexChain">
	<title>NexChain</title>
	<desc>Hexagon block with a node-graph letter N and a nexus node at its centre.</desc>
	<defs>
		<linearGradient id="nxGrad" x1="8" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#2b9fd8" />
			<stop offset="1" stop-color="#0f766e" />
		</linearGradient>
	</defs>
	<!-- hexagon = block / chain -->
	<path d="M59 32 45.5 8.62H18.5L5 32l13.5 23.38h27L59 32Z"
		fill="none" stroke="url(#nxGrad)" stroke-width="4.5" stroke-linejoin="round" />
	<!-- N = network graph: 2 stems + 1 diagonal -->
	<path d="M21 20v24M21 20l22 24M43 20v24"
		fill="none" stroke="url(#nxGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
	<!-- nodes -->
	<g fill="url(#nxGrad)">
		<circle cx="21" cy="20" r="3.4" />
		<circle cx="21" cy="44" r="3.4" />
		<circle cx="43" cy="20" r="3.4" />
		<circle cx="43" cy="44" r="3.4" />
		<circle cx="32" cy="32" r="4.6" />
	</g>
</svg>
