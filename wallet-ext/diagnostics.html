<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>NexChain Wallet — Diagnostik</title>
		<style>
			:root {
				color-scheme: light;
			}
			body {
				margin: 0;
				padding: 16px;
				font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
				background: #0f172a;
				color: #e2e8f0;
			}
			h1 {
				font-size: 15px;
				margin: 0 0 4px;
				color: #fff;
			}
			.sub {
				color: #94a3b8;
				margin: 0 0 14px;
				font-size: 11px;
			}
			table {
				border-collapse: collapse;
				width: 100%;
				margin-bottom: 14px;
			}
			td {
				padding: 5px 8px;
				border-bottom: 1px solid #1e293b;
				vertical-align: top;
			}
			td:first-child {
				color: #94a3b8;
				white-space: nowrap;
				width: 1%;
			}
			.ok {
				color: #4ade80;
			}
			.bad {
				color: #f87171;
				font-weight: 700;
			}
			.warn {
				color: #fbbf24;
			}
			pre {
				background: #1e293b;
				padding: 10px;
				border-radius: 6px;
				overflow: auto;
				font-size: 11px;
				white-space: pre-wrap;
				margin: 0 0 12px;
			}
			button {
				background: #2563eb;
				color: #fff;
				border: 0;
				border-radius: 6px;
				padding: 7px 14px;
				font: inherit;
				cursor: pointer;
			}
			button:hover {
				background: #1d4ed8;
			}
			h2 {
				font-size: 12px;
				color: #64748b;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				margin: 16px 0 6px;
			}
		</style>
	</head>
	<body>
		<h1>Diagnostik NexChain Wallet</h1>
		<p class="sub">
			Halaman ini berjalan DI DALAM konteks extension asli, jadi hasilnya
			menentukan (bukan tiruan seperti preview.html).
		</p>

		<h2>Lingkungan</h2>
		<table id="env"></table>

		<h2>Uji Kemampuan</h2>
		<table id="tests"></table>

		<h2>Salinan hasil (kirim ini bila masih gagal)</h2>
		<pre id="dump">menjalankan…</pre>
		<button id="copy">Salin hasil</button>

		<script type="module" src="/src/popup/diagnostics.ts"></script>
	</body>
</html>
