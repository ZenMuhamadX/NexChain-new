<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>NexChain Wallet</title>
		<style>
			/*
			 * Shell popup extension.
			 *
			 * Ukuran TERKUNCI (bukan responsif) — Chrome memberi popup kotak tetap
			 * 800x600 maksimum, dan layout desktop dari wallet-ui (grid 1240px,
			 * nav horizontal, sidebar sticky) tidak masuk akal di sana.
			 *
			 * Lebar 360px = lebar popup wallet standar (MetaMask/Phantom).
			 * Tinggi 600px = plafon Chrome; konten mengisi sisa ruang dan
			 * menggulir di dalam `.app-main`, bukan di seluruh dokumen.
			 */
			html,
			body {
				margin: 0;
				padding: 0;
				/* !important wajib: src/style.css (dimuat Vite SETELAH
				   <style> ini) mendeklarasikan `html, body, #root { height: 100% }`
				   dengan spesifisitas sama. Tanpa !important, aturan itu
				   menang lewat source-order dan menggantikan 600px → popup
				   mengecil mengikuti viewport Chrome, konten jadi terpotong. */
				width: 360px !important;
				height: 600px !important;
				overflow: hidden !important;
			}

			html {
				background: #f4f6fa;
				color-scheme: light;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/popup/entry.tsx"></script>
	</body>
</html>
