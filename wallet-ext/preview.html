<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<title>Preview — semua layar popup NexChain Wallet</title>
		<!--
			Harness verifikasi VISUAL saja (tidak dikirim ke extension).

			Halaman ini TIDAK memakai React dari src/ agar bisa memuat
			style.css asli dan merender tanda-up markup yang identik dengan
			komponen sebenarnya. Tujuannya memeriksa TATA LETAK pada ukuran
			popup 360x600: apakah ada yang meluber, terpotong, atau tumpang
			tindih — hal yang tidak bisa dibuktikan oleh tsc.

			Jalankan:  bun run preview:shots
		-->
		<link rel="stylesheet" href="/src/style.css" />
		<style>
			body {
				margin: 0;
				background: #ffffff;
				font-family: Inter, ui-sans-serif, system-ui, sans-serif;
			}

			/* Grid 3 kolom tetap, bukan flex-wrap. Dengan flex-wrap, jumlah
			   kolom ikut lebar jendela — dan pass pengukuran (--dump-dom) serta
			   pass tangkapan (--screenshot) memakai tinggi jendela berbeda,
			   sehingga koordinat meleset. Grid memaku tata letak. */
			.stage {
				display: grid;
				grid-template-columns: repeat(3, 360px);
				gap: 20px;
				padding: 20px;
				align-content: start;
				justify-content: start;
			}

			.shot {
				width: 360px;
				height: 600px;
				overflow: hidden;
				border-radius: 12px;
				background: #f4f6fa;
				box-shadow: 0 6px 22px rgba(15, 24, 38, 0.18);
			}

			.shot__label {
				width: 360px;
				margin: 0 0 6px;
				color: #475569;
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}

			.shot__frame {
				display: flex;
				flex-direction: column;
				width: 360px;
				height: 600px;
				overflow: hidden;
			}

			/* Di extension asli overlay modal memakai position:fixed dan
			   memang seharusnya menutupi seluruh popup — sebab popup sendirilah
			   viewport-nya. Di harness, 16 kotak berbagi satu viewport, jadi
			   overlay fixed akan menutupi kotak tetangga. Kunci dia di dalam
			   kotak supaya tiap layar terisolasi. */
			.shot__frame {
				position: relative;
			}
			.shot__frame .modal-overlay {
				position: absolute;
			}
		</style>
	</head>

			const stage = document.getElementById('stage')
			stage.innerHTML = Object.entries(screens)
				.map(
					([name, html]) => `
					<div data-shot="${name}">
						<p class="shot__label">${name}</p>
						<div class="shot"><div class="shot__frame">${html}</div></div>
					</div>`,
				)
				.join('')

			// Tulis geometri kotak nyata ke DOM supaya skrip pemotong tidak
			// perlu menebak tinggi baris. Sebelumnya cropShots.py mengasumsikan
			// langkah 640px; begitu satu layar melar, semua potongan setelahnya
			// bergeser. Data di bawah diambil langsung dari tata letak browser.
			const boxes = [...stage.querySelectorAll('[data-shot]')].map((el) => {
				const frame = el.querySelector('.shot').getBoundingClientRect()
				return {
					name: el.dataset.shot,
					x: Math.round(frame.left),
					y: Math.round(frame.top),
					w: Math.round(frame.width),
					h: Math.round(frame.height),
				}
			})
			const geo = document.createElement('script')
			geo.type = 'application/json'
			geo.id = 'shot-geometry'
			geo.textContent = JSON.stringify(boxes)
			document.head.appendChild(geo)

			document.title = `Preview siap — ${Object.keys(screens).length} layar`
			document.body.dataset.ready = 'true'
		</script>
